<header class="app-bar">
  <a [routerLink]="brandLink" class="brand">SignalVille</a>

  @if (currentUser(); as user) {
    <div class="user-menu" [class.user-menu--open]="isMenuOpen()">
      <button
        type="button"
        class="user-menu__trigger"
        (click)="toggleMenu($event)"
        [attr.aria-expanded]="isMenuOpen()"
        aria-haspopup="menu"
      >
        <span class="user-menu__avatar" aria-hidden="true">
          {{ user.firstName.charAt(0) }}{{ user.lastName.charAt(0) }}
        </span>
        <span class="user-menu__identity">
          <span class="user-menu__name">{{ user.firstName }} {{ user.lastName }}</span>
          <span class="user-menu__role">{{ user.role }}</span>
        </span>
        <svg class="user-menu__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      @if (isMenuOpen()) {
        <div class="user-menu__dropdown" role="menu">
          <div class="user-menu__header">
            <span class="user-menu__header-name">{{ user.firstName }} {{ user.lastName }}</span>
            <span class="user-menu__header-email">{{ user.email }}</span>
          </div>

          <a routerLink="/profile" class="user-menu__item" role="menuitem">
            <svg class="user-menu__item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Mon profil</span>
          </a>

          <button
            type="button"
            class="user-menu__item user-menu__item--danger"
            role="menuitem"
            (click)="logout()"
          >
            <svg class="user-menu__item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Deconnexion</span>
          </button>
        </div>
      }
    </div>
  } @else {
    <span class="tagline">Plateforme de signalement d'incidents urbains</span>
  }
</header>
