spring:
  application:
    name: signalville-backend

  datasource:
    url: ${SIGNALVILLE_DB_URL:jdbc:postgresql://localhost:5433/signalville}
    username: ${POSTGRES_USER:signalville}
    password: ${POSTGRES_PASSWORD:signalville}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      # 5 Mo par photo (contrainte metier), 3 photos max + le champ JSON
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Le contrat OpenAPI declare le serveur sur http://localhost:8080/api/v1
    context-path: /api/v1

signalville:
  jwt:
    # Secret de developpement uniquement. En production : variable d'environnement.
    secret: ${SIGNALVILLE_JWT_SECRET:ZGV2LW9ubHktc2lnbmFsdmlsbGUtc2VjcmV0LWtleS1obWFjLXNoYTI1Ni1lcGYtYWZyaWNh}
    access-token-ttl-seconds: 900        # 15 minutes
    refresh-token-ttl-days: 7
    issuer: signalville
  storage:
    upload-dir: ${SIGNALVILLE_UPLOAD_DIR:./uploads/reports}
    max-photo-size-bytes: 5242880        # 5 Mo
    allowed-content-types: image/jpeg,image/png
  cors:
    allowed-origins: ${SIGNALVILLE_CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    africa.epf.signalville_backend: ${SIGNALVILLE_LOG_LEVEL:DEBUG}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs