services:
  postgres:
    image: postgres:16-alpine
    container_name: signalville-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalville}
      POSTGRES_USER: ${POSTGRES_USER:-signalville}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalville}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - signalville_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signalville} -d ${POSTGRES_DB:-signalville}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  signalville_pgdata: